name: Deploy to AWS EC2
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            source ~/.bashrc || source ~/.profile
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            cd ~/todo-app || git clone https://github.com/Cristopher050/ToDoList-CICD.git ~/todo-app
            cd ~/todo-app
            git pull origin main
            npm install
            pm2 restart all || pm2 start index.js --name "todo-app"