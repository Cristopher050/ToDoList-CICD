version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tododb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: node_backend
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/tododb
      PORT: 3000
    # --- VOLÚMENES PARA AUTO-RELOAD DEL BACKEND ---
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    restart: always

  frontend:
    build: ./frontend
    container_name: nginx_frontend
    # --- VOLÚMENES PARA AUTO-RELOAD DEL FRONTEND ---
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  pgdata: